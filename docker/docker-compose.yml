services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "4000:4000"
    env_file:
      - ../backend/.env
    environment:
      - CORS_ORIGIN=http://localhost:5173
    networks:
      - applyai

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - applyai

  # Phase 8 — job discovery + compliant outreach automation
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    env_file:
      - ../n8n/.env
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Kolkata}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-dev-only-change-me}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/home/node/workflows:ro
      - ../n8n/config:/home/node/config:ro
    networks:
      - applyai
    restart: unless-stopped

networks:
  applyai:
    driver: bridge

volumes:
  n8n_data:
